<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shotclock Scoreboard Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent; /* keep transparent for OBS */
    font-family: "Arial", sans-serif;
    overflow: hidden;
  }

  .scoreboard {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 12px;
    padding: 14px;
  }

  .card {
    background: rgba(18, 18, 18, 0.88);
    border: 2px solid #2c2c2c;
    border-radius: 10px;
    padding: 14px 22px;
    color: white;
    text-align: center;
    min-width: 220px;
    box-shadow: 0 0 12px rgba(0,0,0,0.5);
  }

  .team-name {
    font-size: 20px;
    font-weight: bold;
    color: #4FC3F7;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .player-name {
    font-size: 16px;
    color: #ffffff;
    opacity: 0.9;
    margin-bottom: 8px;
    min-height: 20px;
  }

  .score {
    font-size: 56px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 8px;
    font-size: 14px;
    color: #cccccc;
  }

  .stats-row span.value {
    color: #FFD700;
    font-weight: bold;
    margin-left: 4px;
  }

  .center-card {
    background: rgba(18, 18, 18, 0.88);
    border: 2px solid #2c2c2c;
    border-radius: 10px;
    padding: 14px 20px;
    color: #FFD700;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    align-self: center;
    min-width: 140px;
    text-transform: uppercase;
    box-shadow: 0 0 12px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <div class="scoreboard">

    <div class="card">
      <div class="team-name" id="leftTeam">Team</div>
      <div class="player-name" id="p1Name">Player 1</div>
      <div class="score" id="p1Score">0</div>
      <div class="stats-row">
        <div>Foul<span class="value" id="p1Foul">0</span></div>
        <div>Ext<span class="value" id="p1Ext">0</span></div>
      </div>
    </div>

    <div class="center-card" id="centerLabel">SBA</div>

    <div class="card">
      <div class="team-name" id="rightTeam">Team</div>
      <div class="player-name" id="p2Name">Player 2</div>
      <div class="score" id="p2Score">0</div>
      <div class="stats-row">
        <div>Foul<span class="value" id="p2Foul">0</span></div>
        <div>Ext<span class="value" id="p2Ext">0</span></div>
      </div>
    </div>

  </div>

<script>
  // Point this at wherever your Python HTTP server is running.
  // Matches the server added to sba_shotclock.py (default port 8000).
  const BASE_URL = "http://localhost:8000";
  const POLL_MS = 500; // how often to refresh (ms)

  // Maps: DOM element id -> txt file name served by the local server
  const FILE_MAP = {
    leftTeam:    "obs_left_team.txt",
    rightTeam:   "obs_right_team.txt",
    p1Name:      "obs_player1.txt",
    p2Name:      "obs_player2.txt",
    p1Score:     "obs_player1_score.txt",
    p2Score:     "obs_player2_score.txt",
    p1Foul:      "obs_player1_foul.txt",
    p2Foul:      "obs_player2_foul.txt",
    p1Ext:       "obs_player1_ext.txt",
    p2Ext:       "obs_player2_ext.txt",
    centerLabel: "obs_center_label.txt"
  };

  async function fetchText(filename) {
    try {
      // cache-busting param so browser source always gets fresh data
      const res = await fetch(`${BASE_URL}/${filename}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) return null;
      return (await res.text()).trim();
    } catch (err) {
      return null;
    }
  }

  async function refresh() {
    for (const [elementId, filename] of Object.entries(FILE_MAP)) {
      const value = await fetchText(filename);
      if (value !== null) {
        const el = document.getElementById(elementId);
        if (el) el.textContent = value.length ? value : el.textContent;
      }
    }
  }

  refresh();
  setInterval(refresh, POLL_MS);
</script>

</body>
</html>
